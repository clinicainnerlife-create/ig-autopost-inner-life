name: Post agendado no Instagram

on:
  schedule:
    # Toda terça e sexta, 13h UTC = 10h horário de Brasília
    - cron: "0 13 * * 2,5"
  workflow_dispatch: {}  # permite rodar manualmente pelo botão "Run workflow" no GitHub

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instala dependências
        run: |
          sudo apt-get update && sudo apt-get install -y wkhtmltopdf
          pip install -r requirements.txt

      - name: Gera e publica o post
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python run_scheduled_post.py

      # 1º deploy: publica a imagem gerada no GitHub Pages (fica pública)
      - name: Publica no GitHub Pages
        run: |
          git config user.name "ig-autopost-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/generated
          git commit -m "Adiciona imagem gerada" || echo "nada novo pra commitar"
          git push

      # 2º deploy: salva o content_calendar.yaml atualizado (post marcado como enviado)
      - name: Salva progresso da fila
        run: |
          git add content_calendar.yaml
          git commit -m "Marca post como publicado" || echo "nada novo pra commitar"
          git push
