name: Post agendado no Instagram

on:
  schedule:
    # Toda terça e quinta, 14h50 UTC = 11h50 horário de Brasília
    - cron: "50 14 * * 2,4"
  workflow_dispatch: {}  # permite rodar manualmente pelo botão "Run workflow" no GitHub

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instala dependências
        run: |
          sudo apt-get update && sudo apt-get install -y wkhtmltopdf
          pip install -r requirements.txt

      - name: "Etapa 1: gera a imagem"
        run: python generate_step.py

      - name: Publica a imagem no GitHub Pages
        run: |
          git config user.name "ig-autopost-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/generated
          git commit -m "Adiciona imagem gerada" || echo "nada novo pra commitar"
          git push

      - name: "Etapa 2: espera propagar e publica no Instagram"
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python publish_step.py

      - name: Salva progresso da fila
        run: |
          git add content_calendar.yaml
          git commit -m "Marca post como publicado" || echo "nada novo pra commitar"
          git push
