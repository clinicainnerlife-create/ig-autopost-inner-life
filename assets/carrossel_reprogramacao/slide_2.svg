<svg viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
  <rect width="1080" height="1080" fill="#F7F1E7"/>
  <rect x="0" y="0" width="1080" height="150" fill="#6E2F3B"/>
  <text x="90" y="95" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="6" fill="#EFD9C5">VOCÊ SE RECONHECE?</text>

  <text x="90" y="290" font-family="Georgia, 'Times New Roman', serif" font-size="48" fill="#6E2F3B" font-style="italic">Sinais de um padrão</text>
  <text x="90" y="345" font-family="Georgia, 'Times New Roman', serif" font-size="48" fill="#6E2F3B" font-style="italic">que se repete</text>

  <!-- item 1 -->
  <circle cx="105" cy="460" r="8" fill="#D9B366"/>
  <text x="150" y="450" font-family="'Helvetica Neue', Arial, sans-serif" font-size="30" fill="#6E2F3B" font-weight="400">Sabota o que está indo bem</text>
  <text x="150" y="490" font-family="'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#8C3E4C" font-weight="300">numa relação ou num projeto</text>

  <!-- item 2 -->
  <circle cx="105" cy="600" r="8" fill="#D9B366"/>
  <text x="150" y="590" font-family="'Helvetica Neue', Arial, sans-serif" font-size="30" fill="#6E2F3B" font-weight="400">Trava na hora de decidir,</text>
  <text x="150" y="630" font-family="'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#8C3E4C" font-weight="300">mesmo sabendo o que quer</text>

  <!-- item 3 -->
  <circle cx="105" cy="740" r="8" fill="#D9B366"/>
  <text x="150" y="730" font-family="'Helvetica Neue', Arial, sans-serif" font-size="30" fill="#6E2F3B" font-weight="400">Sente o mesmo medo</text>
  <text x="150" y="770" font-family="'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#8C3E4C" font-weight="300">voltar, de novo e de novo</text>

  <rect x="0" y="930" width="1080" height="150" fill="#E7B9BE"/>
  <text x="90" y="1010" font-family="'Helvetica Neue', Arial, sans-serif" font-size="26" fill="#6E2F3B" font-weight="300">Se marcou pelo menos 1 → continua lendo</text>

  <g transform="translate(462,1010)">
    <circle cx="-35" cy="0" r="6" fill="none" stroke="#6E2F3B" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="7" fill="#D9B366"/>
    <circle cx="35" cy="0" r="6" fill="none" stroke="#6E2F3B" stroke-width="1.5"/>
    <circle cx="70" cy="0" r="6" fill="none" stroke="#6E2F3B" stroke-width="1.5"/>
    <circle cx="105" cy="0" r="6" fill="none" stroke="#6E2F3B" stroke-width="1.5"/>
  </g>
</svg>
